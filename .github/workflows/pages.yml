# preview -> GitHub Pages (https://duplessisetienne.github.io/prolec/) on every push to main
# live    -> HostAfrica over FTP, only when run by hand:
#            Actions > Deploy site > Run workflow > tick "Also publish to the live site"
# Requires Settings > Pages > Source = "GitHub Actions".
# Live deploy secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, and optionally FTP_DIR (default public_html/)
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      go_live:
        description: "Also publish to the live site (HostAfrica)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  preview:
    name: Preview (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Keep the preview out of search engines
        run: |
          cp -r site _preview
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow">|' _preview/*.html
          printf 'User-agent: *\nDisallow: /\n' > _preview/robots.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _preview
      - id: deployment
        uses: actions/deploy-pages@v5

  live:
    name: Live (HostAfrica FTP)
    runs-on: ubuntu-latest
    needs: preview
    if: github.event_name == 'workflow_dispatch' && inputs.go_live
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Stop if HostAfrica FTP secrets are missing
        if: env.FTP_SERVER == ''
        run: |
          echo "::error::FTP_SERVER secret not set; add the HostAfrica FTP secrets first."
          exit 1
      - uses: actions/checkout@v6
        if: env.FTP_SERVER != ''
      - name: Upload site to HostAfrica
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            README.md
